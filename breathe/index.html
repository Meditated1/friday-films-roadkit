<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>breathe, as you wish</title>

<!-- PWA / add-to-home-screen -->
<meta name="theme-color" content="#181A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="breathe">
<meta name="description" content="A small, calm breathing app — a zen pond and a deep Tide tone, breathe however you wish.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<!-- Fonts (with graceful serif fallback if offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1A1A18; --paper:#F4EFE6; --stone:#8C8880; --mist:#C8C2B8;
    --sage:#6B8F71; --warm:#C4894F;
    --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    --jp:"Noto Serif JP", "Cormorant Garamond", serif;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink); color:var(--mist);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }

  /* ---- screen plumbing ---- */
  .screen{
    position:fixed; inset:0; display:flex; flex-direction:column;
    opacity:0; pointer-events:none; transition:opacity 1.1s ease;
  }
  .screen.on{ opacity:1; pointer-events:auto; }

  /* ---- HOME ---- */
  #home{
    background:radial-gradient(120% 80% at 50% -10%, #20221C, var(--ink) 70%);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .home-inner{
    width:100%; max-width:440px; margin:0 auto;
    padding:calc(var(--safe-t) + 46px) 26px calc(var(--safe-b) + 40px);
  }
  .brand{ text-align:center; margin-bottom:30px; }
  .brand h1{
    font-family:var(--serif); font-style:italic; font-weight:300;
    font-size:38px; line-height:1.1; margin:0; color:var(--paper);
    letter-spacing:.01em;
  }
  .brand .lead{
    font-size:17px; font-weight:300; color:var(--stone); margin-top:12px;
    font-style:italic; letter-spacing:.02em;
  }

  .label{
    font-family:var(--jp); font-weight:300; font-size:11px;
    letter-spacing:.34em; text-transform:uppercase; color:var(--stone);
    margin:0 0 12px 2px;
  }
  section{ margin-bottom:30px; }

  /* pattern list */
  .pat{
    display:flex; align-items:baseline; gap:12px;
    padding:14px 16px; margin-bottom:8px; cursor:pointer;
    border-left:2px solid transparent; border-radius:4px;
    transition:background .4s ease, border-color .4s ease;
  }
  .pat:hover{ background:rgba(255,255,255,.018); }
  .pat.sel{ background:rgba(107,143,113,.07); border-left-color:var(--sage); }
  .pat .nm{ font-size:21px; font-weight:400; color:var(--paper); flex:0 0 auto; }
  .pat.sel .nm{ color:#fff; }
  .pat .ds{ font-size:14.5px; font-style:italic; font-weight:300; color:var(--stone); flex:1 1 auto; line-height:1.35; }
  .pat .jp{ font-family:var(--jp); font-weight:300; font-size:15px; color:var(--sage); opacity:.8; flex:0 0 auto; }

  /* custom editor + coherent sub-option */
  .sub{ overflow:hidden; max-height:0; opacity:0; transition:max-height .5s ease, opacity .4s ease; }
  .sub.open{ max-height:340px; opacity:1; }
  .editor{ padding:6px 16px 4px; }
  .erow{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; }
  .erow .et{ font-size:17px; color:var(--mist); }
  .erow .et small{ color:var(--stone); font-style:italic; }
  .stepper{ display:flex; align-items:center; gap:14px; }
  .stepper button{
    width:32px; height:32px; border-radius:50%; border:1px solid rgba(200,194,184,.3);
    background:transparent; color:var(--mist); font-size:18px; line-height:1; cursor:pointer;
    font-family:var(--serif); transition:border-color .3s, color .3s;
  }
  .stepper button:active{ border-color:var(--sage); color:var(--sage); }
  .stepper .val{ min-width:42px; text-align:center; font-size:18px; color:var(--paper); }
  .stepper .val small{ font-size:12px; color:var(--stone); }
  .toggle-hold{
    border:none; background:transparent; color:var(--stone); cursor:pointer;
    font-family:var(--serif); font-style:italic; font-size:15px;
  }
  .toggle-hold.on{ color:var(--sage); }

  /* segmented controls */
  .seg{ display:flex; flex-wrap:wrap; gap:8px; }
  .seg button{
    flex:1 1 auto; min-width:64px; padding:11px 8px;
    background:transparent; border:1px solid rgba(200,194,184,.18); border-radius:6px;
    color:var(--stone); font-family:var(--serif); font-size:16px; cursor:pointer;
    transition:border-color .35s, color .35s, background .35s;
  }
  .seg button.sel{ border-color:var(--sage); color:var(--paper); background:rgba(107,143,113,.08); }
  .seg .jp{ font-family:var(--jp); font-weight:300; font-size:13px; }

  .honest{ text-align:center; font-style:italic; font-size:14px; color:var(--stone); margin-top:14px; min-height:1.2em; }
  .silentnote{ font-size:12.5px; font-style:italic; color:var(--stone); opacity:.75; margin-top:9px; line-height:1.4; }

  .begin{
    display:block; width:100%; margin-top:6px; padding:18px;
    background:transparent; border:1px solid var(--sage); border-radius:8px;
    color:var(--paper); cursor:pointer; transition:background .5s ease;
    font-size:19px;
  }
  .begin:active{ background:rgba(107,143,113,.14); }
  .begin .jp{ font-family:var(--jp); font-weight:300; letter-spacing:.12em; }
  .begin .en{ color:var(--stone); font-style:italic; }

  /* ---- SESSION ---- */
  #session{ background:#181A16; }
  #pond{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .s-top{
    position:absolute; left:0; right:0; top:calc(var(--safe-t) + 8px);
    text-align:center; pointer-events:none;
  }
  .phase-jp{ font-family:var(--jp); font-weight:200; font-size:20px; color:var(--sage); opacity:.55; }
  .phase-word{
    font-family:var(--serif); font-weight:300; font-size:30px; letter-spacing:.16em;
    text-transform:lowercase; color:var(--paper); margin-top:6px;
    transition:opacity .8s ease;
  }

  .s-bottom{
    position:absolute; left:0; right:0; bottom:calc(var(--safe-b) + 22px);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px;
  }
  .cyc{ font-style:italic; font-size:14.5px; color:var(--stone); }
  .s-btn{
    background:transparent; border:none; color:var(--stone); cursor:pointer;
    font-family:var(--serif); font-style:italic; font-size:15px; padding:8px;
    transition:color .3s;
  }
  .s-btn:active{ color:var(--mist); }

  /* settle countdown */
  .settle{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    pointer-events:none; opacity:0; transition:opacity 1s ease;
  }
  .settle.on{ opacity:1; }
  .settle .word{ font-family:var(--jp); font-weight:200; font-size:13px; letter-spacing:.3em; text-transform:uppercase; color:var(--stone); }
  .settle .n{ font-family:var(--serif); font-weight:300; font-size:68px; color:var(--mist); margin-top:18px; transition:opacity .4s; }

  /* closing reflection / after */
  .closing{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:0 36px; opacity:0; pointer-events:none; transition:opacity 1.4s ease;
    background:rgba(24,26,22,0);
  }
  .closing.on{ opacity:1; pointer-events:auto; }
  .closing .reflect{
    font-family:var(--serif); font-style:italic; font-weight:300;
    font-size:24px; line-height:1.5; color:var(--paper); max-width:30ch;
  }
  .closing .rest{ font-family:var(--jp); font-weight:200; font-size:12px; letter-spacing:.32em; text-transform:uppercase; color:var(--stone); margin-top:26px; }
  .closing .after{
    margin-top:48px; opacity:0; transition:opacity 1.4s ease; transition-delay:.2s;
    display:flex; flex-direction:column; align-items:center; gap:22px;
  }
  .closing .after.on{ opacity:1; }
  .closing .count{ font-style:italic; font-size:15px; color:var(--stone); }
  .closing .acts{ display:flex; gap:30px; }
  .closing .acts button{
    background:transparent; border:none; cursor:pointer; padding:8px 4px;
    font-family:var(--serif); font-size:19px; color:var(--mist); transition:color .3s;
  }
  .closing .acts button .jp{ font-family:var(--jp); font-weight:300; }
  .closing .acts button:active{ color:var(--paper); }
  .closing .acts .again{ color:var(--sage); }

  @media (max-height:560px){ .brand{ margin-bottom:20px;} section{ margin-bottom:22px; } }
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div id="home" class="screen">
  <div class="home-inner">
    <div class="brand">
      <h1>breathe, as you wish</h1>
      <div class="lead">choose a breath, a length, a look — then let it go.</div>
    </div>

    <section>
      <p class="label">the breath</p>
      <div id="patList"></div>
      <!-- coherent rate sub-option -->
      <div id="coherentSub" class="sub">
        <div class="editor">
          <div class="erow">
            <span class="et"><small>pace</small></span>
            <div class="seg" style="max-width:200px">
              <button data-rate="5.5">5.5s</button>
              <button data-rate="6">6.0s</button>
            </div>
          </div>
        </div>
      </div>
      <!-- custom editor -->
      <div id="customSub" class="sub">
        <div class="editor" id="customEditor"></div>
      </div>
    </section>

    <section>
      <p class="label">the length</p>
      <div class="seg" id="lenSeg">
        <button data-len="2">2 min</button>
        <button data-len="5">5 min</button>
        <button data-len="10">10 min</button>
        <button data-len="inf">until I stop</button>
      </div>
      <div class="honest" id="honest"></div>
    </section>

    <section>
      <p class="label">the look</p>
      <div class="seg" id="themeSeg">
        <button data-theme="auto">auto</button>
        <button data-theme="sage">day <span class="jp">昼</span></button>
        <button data-theme="moonstone">night <span class="jp">夜</span></button>
      </div>
    </section>

    <section>
      <p class="label">the sound</p>
      <div class="seg" id="soundSeg" style="max-width:240px">
        <button data-sound="on">tide on</button>
        <button data-sound="off">silent</button>
      </div>
      <p class="silentnote">The Tide plays through your speaker and follows your phone's hardware silent switch.</p>
    </section>

    <button class="begin" id="beginBtn">
      <span class="jp">始める</span> &nbsp;·&nbsp; <span class="en">begin</span>
    </button>
  </div>
</div>

<!-- ============ SESSION ============ -->
<div id="session" class="screen">
  <canvas id="pond"></canvas>

  <div class="s-top">
    <div class="phase-jp" id="phaseJp"></div>
    <div class="phase-word" id="phaseWord"></div>
  </div>

  <div class="settle" id="settle">
    <div class="word">settle in</div>
    <div class="n" id="settleN">10</div>
  </div>

  <div class="closing" id="closing">
    <div class="reflect" id="reflect"></div>
    <div class="rest">rest here</div>
    <div class="after" id="after">
      <div class="count" id="count"></div>
      <div class="acts">
        <button class="again" id="againBtn"><span class="jp">再び</span> · again</button>
        <button id="doneBtn">done</button>
      </div>
    </div>
  </div>

  <div class="s-bottom">
    <button class="s-btn" id="soundToggle">tide</button>
    <span class="cyc" id="cyc"></span>
    <button class="s-btn" id="endBtn">end</button>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   breathe, as you wish — Gen 1, one file. Written module-shaped so each block
   (Store / Themes / Patterns / Reflections / Pond / Tide / Clock / App) can be
   lifted into its own file later. Tuned constants carried from the Ippo pond.
   ========================================================================== */

/* ---------- Store: localStorage prefs + gentle session count ------------- */
const Store = {
  get(k, d){ try{ const v = localStorage.getItem('baw:'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('baw:'+k, JSON.stringify(v)); }catch(e){} },
};

/* ---------- Themes: day = sage, night = moonstone ------------------------ */
const THEMES = {
  sage:      { bg:'#181A16', fill:[104,144,114], edge:[185,214,190], glow:'rgba(107,143,113,0.13)', ring:'rgba(107,143,113,0.26)' },
  moonstone: { bg:'#15171B', fill:[104,138,150], edge:[190,216,226], glow:'rgba(120,158,170,0.13)', ring:'rgba(120,158,170,0.26)' },
};
function autoThemeKey(){ const h = new Date().getHours(); return (h >= 6 && h < 18) ? 'sage' : 'moonstone'; }

/* ---------- Patterns: a breath is just data ------------------------------ */
const PATTERNS = [
  { id:'box', name:'Box', jp:'四角', desc:'Steady and grounding. Equal counts.',
    phases:[ {kind:'inhale',label:'Inhale',secs:4},{kind:'hold',label:'Hold',secs:4},{kind:'exhale',label:'Release',secs:4},{kind:'hold',label:'Hold',secs:4} ] },
  { id:'478', name:'4·7·8', jp:'安眠', desc:'In 4, hold 7, out 8. For sleep.',
    phases:[ {kind:'inhale',label:'Inhale',secs:4},{kind:'hold',label:'Hold',secs:7},{kind:'exhale',label:'Release',secs:8} ] },
  { id:'coherent', name:'Coherent', jp:'調和', desc:'Even and slow. Settles the nerves.',
    phases:[ {kind:'inhale',label:'Inhale',secs:5.5},{kind:'exhale',label:'Release',secs:5.5} ] },
  { id:'calm', name:'Calm', jp:'静', desc:'In 4, out 6. A gentle downshift.',
    phases:[ {kind:'inhale',label:'Inhale',secs:4},{kind:'exhale',label:'Release',secs:6} ] },
  { id:'custom', name:'as you wish', jp:'随意', desc:'Set every count yourself.', custom:true },
];
const PHASE_JP = { inhale:'吸', exhale:'吐', hold:'止' };

/* ---------- Reflections: short, stoic/zen, original ---------------------- */
const REFLECTIONS = [
  'The breath was always here. You only returned to it.',
  'Nothing was added. Something was set down.',
  'Stillness is not the absence of motion, but its rest.',
  'You did not calm the water. You stopped disturbing it.',
  'To begin again is the whole of the practice.',
  'What is carried lightly is carried far.',
  'The pond keeps no record of the stone.',
  'You arrived without trying. Leave the same way.',
  'A quiet mind is not empty. It is unhurried.',
  'The wave returns to the sea and loses nothing.',
];

/* ---------- Pond: per-pixel water on a small offscreen buffer ------------ */
function createPond(canvas){
  const ctx = canvas.getContext('2d');
  const N = 150, c0 = N/2, pondR = N/2 * 0.95, FEATHER = pondR * 0.17;

  const buf = document.createElement('canvas'); buf.width = N; buf.height = N;
  const bctx = buf.getContext('2d');
  const img = bctx.createImageData(N, N);
  const data = img.data;

  // precompute pixel radius once
  const radius = new Float32Array(N*N);
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const dx=x+0.5-c0, dy=y+0.5-c0; radius[y*N+x]=Math.hypot(dx,dy); }

  let theme = THEMES.sage;
  let wf = 0, drop = 0;
  let from = 0, to = 0, tStart = 0, tDur = 0;   // linear tween
  let dpr = 1, W = 0, H = 0, SIZE = 0;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    SIZE = Math.min(W,H);
  }
  function setTheme(t){ theme = t; }
  function setPhase(kind, durSecs){
    from = wf; tStart = performance.now();
    if(kind==='inhale'){ to = 1; tDur = durSecs*1000; drop = 1; }
    else if(kind==='exhale'){ to = 0; tDur = durSecs*1000; }
    else { to = wf; tDur = 0; }            // hold: keep front where it is
  }
  function settleTo(v){ wf = from = to = v; tDur = 0; drop = 0; }

  function smoothstep(e0,e1,x){ if(e1===e0) return x<e0?0:1; let t=(x-e0)/(e1-e0); t=t<0?0:t>1?1:t; return t*t*(3-2*t); }

  function render(now){
    if(tDur>0){ let t=(now-tStart)/tDur; if(t>1)t=1; wf = from + (to-from)*t; }   // linear pacing
    if(drop>0){ drop*=0.93; if(drop<0.01) drop=0; }

    const front = wf*pondR;
    const moving = (wf>0.01 && wf<0.99) ? 1 : 0.4;
    const shimmer = 0.65 + 0.35*Math.sin(now/480);
    const fc = theme.fill, ec = theme.edge;

    for(let i=0;i<N*N;i++){
      const r = radius[i], o = i*4;
      if(r > pondR){ data[o+3]=0; continue; }
      let fill = 1 - smoothstep(front-FEATHER, front+FEATHER, r);
      const bloom = Math.exp(-r*0.45) * drop;          // pebble bloom at inhale start
      if(bloom > fill) fill = bloom;
      const u = (r-front)/(FEATHER*0.95);
      const lead = Math.exp(-u*u) * moving * shimmer;  // glowing leading edge
      const rim = 1 - smoothstep(pondR*0.80, pondR, r);
      const lc = lead<1 ? lead : 1;
      data[o]   = fc[0] + (ec[0]-fc[0])*lc;
      data[o+1] = fc[1] + (ec[1]-fc[1])*lc;
      data[o+2] = fc[2] + (ec[2]-fc[2])*lc;
      let a = fill*0.85 + lead*0.5; if(a>1) a=1;
      data[o+3] = a * rim * 165;
    }
    bctx.putImageData(img,0,0);

    // composite to visible canvas
    ctx.clearRect(0,0,W,H);
    const cx = W/2, cy = H/2, Rdisp = SIZE*0.36;
    const g = ctx.createRadialGradient(cx,cy,0, cx,cy, Rdisp*1.28);  // fades inside canvas
    g.addColorStop(0, theme.glow); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,Rdisp*1.28,0,Math.PI*2); ctx.fill();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(buf, cx-Rdisp, cy-Rdisp, Rdisp*2, Rdisp*2);
    ctx.lineWidth = 1.2; ctx.strokeStyle = theme.ring;
    ctx.beginPath(); ctx.arc(cx,cy,Rdisp*0.95,0,Math.PI*2); ctx.stroke();
  }
  return { resize, setTheme, setPhase, settleTo, render };
}

/* ---------- Tide: a deep tone that swells in, ebbs out, silent on holds -- */
function createTide(){
  const LEVEL = 0.11;
  let ctx=null, master=null, g=null, on=true;

  function ensure(){
    if(ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = on?0.8:0.0001; master.connect(ctx.destination);
    const filt = ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=1100; filt.Q.value=0.5; filt.connect(master);
    g = ctx.createGain(); g.gain.value = 0.0001; g.connect(filt);
    const osc1 = ctx.createOscillator(); osc1.type='sine'; osc1.frequency.value=146.83; osc1.connect(g);
    const shadow = ctx.createGain(); shadow.gain.value=0.13; shadow.connect(g);
    const osc2 = ctx.createOscillator(); osc2.type='sine'; osc2.frequency.value=146.83*2.01; osc2.connect(shadow);
    osc1.start(); osc2.start();
  }
  function resume(){ ensure(); if(ctx.state==='suspended') ctx.resume(); }
  function now(){ return ctx ? ctx.currentTime : 0; }

  function phase(kind, t0, dur){
    if(!ctx) return;
    const gg = g.gain;
    gg.cancelScheduledValues(t0);
    gg.setValueAtTime(Math.max(gg.value, 0.0001), t0);
    if(kind==='inhale'){
      gg.linearRampToValueAtTime(LEVEL*0.35, t0 + 0.6);
      gg.linearRampToValueAtTime(LEVEL,      t0 + Math.max(0.7, dur-0.5));
      gg.linearRampToValueAtTime(0.0001,     t0 + Math.max(0.75, dur-0.04));
    } else if(kind==='exhale'){
      gg.linearRampToValueAtTime(LEVEL,      t0 + 0.6);
      gg.linearRampToValueAtTime(LEVEL*0.3,  t0 + Math.max(0.7, dur-0.4));
      gg.linearRampToValueAtTime(0.0001,     t0 + Math.max(0.75, dur-0.04));
    } else {
      gg.linearRampToValueAtTime(0.0001,     t0 + 0.35);
    }
  }
  function setOn(v){
    on = v; if(!master) return;
    const t = now();
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(Math.max(master.gain.value,0.0001), t);
    master.gain.linearRampToValueAtTime(on?0.8:0.0001, t+0.25);
  }
  function silence(){
    if(!g) return;
    const t = now();
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(Math.max(g.gain.value,0.0001), t);
    g.gain.linearRampToValueAtTime(0.0001, t+0.5);
  }
  return { resume, now, phase, setOn, silence, get on(){ return on; } };
}

/* ---------- Clock: one setTimeout chain drives pond + tide together ------ */
function createClock(){
  let phases=[], idx=0, cycle=0, totalCycles=0, untilStop=false, running=false, timer=null;
  let onPhase=null, onCycle=null, onDone=null;

  function start(opts){
    phases = opts.phases; totalCycles = opts.cycles; untilStop = opts.untilStop;
    onPhase = opts.onPhase; onCycle = opts.onCycle; onDone = opts.onDone;
    idx = 0; cycle = 1; running = true;
    if(onCycle) onCycle(cycle, totalCycles, untilStop);
    step();
  }
  function step(){
    if(!running) return;
    const ph = phases[idx];
    if(onPhase) onPhase(ph);
    timer = setTimeout(()=>{
      if(!running) return;
      idx++;
      if(idx >= phases.length){
        idx = 0; cycle++;
        if(!untilStop && cycle > totalCycles){ running=false; if(onDone) onDone(); return; }
        if(onCycle) onCycle(cycle, totalCycles, untilStop);
      }
      step();
    }, ph.secs*1000);
  }
  function stop(){ running=false; if(timer){ clearTimeout(timer); timer=null; } }
  return { start, stop, get running(){ return running; } };
}

/* ---------- App: state, screens, glue ----------------------------------- */
(function App(){
  const $ = s => document.querySelector(s);

  const state = {
    patternId:   Store.get('pattern', 'box'),
    length:      Store.get('length', 5),                 // 2 | 5 | 10 | 'inf'
    themeMode:   Store.get('theme', 'auto'),             // auto | sage | moonstone
    sound:       Store.get('sound', true),
    coherentRate:Store.get('coherentRate', 5.5),         // 5.5 | 6
    custom:      Store.get('custom', { inhale:4, hold1:true, hold1secs:4, exhale:6, hold2:false, hold2secs:4 }),
    sessions:    Store.get('sessions', 0),
    streak:      Store.get('streak', 0),
    lastDay:     Store.get('lastDay', null),
  };

  const pond = createPond($('#pond'));
  const tide = createTide();
  const clock = createClock();
  let rafId = null;
  let settleTimer = null;
  let afterTimer = null;

  /* ---- resolve active pattern / theme ---- */
  function fmt(n){ return Number.isInteger(n) ? String(n) : n.toFixed(1); }

  function resolvePattern(){
    if(state.patternId === 'custom'){
      const c = state.custom;
      const ph = [{kind:'inhale',label:'Inhale',secs:c.inhale}];
      if(c.hold1) ph.push({kind:'hold',label:'Hold',secs:c.hold1secs});
      ph.push({kind:'exhale',label:'Release',secs:c.exhale});
      if(c.hold2) ph.push({kind:'hold',label:'Hold',secs:c.hold2secs});
      return { ...PATTERNS.find(p=>p.id==='custom'), phases:ph };
    }
    if(state.patternId === 'coherent'){
      const r = state.coherentRate;
      return { ...PATTERNS.find(p=>p.id==='coherent'),
        phases:[{kind:'inhale',label:'Inhale',secs:r},{kind:'exhale',label:'Release',secs:r}] };
    }
    return PATTERNS.find(p=>p.id===state.patternId);
  }
  function resolveTheme(){
    const m = state.themeMode;
    if(m==='sage') return THEMES.sage;
    if(m==='moonstone') return THEMES.moonstone;
    return THEMES[autoThemeKey()];
  }
  function cycleSeconds(p){ return p.phases.reduce((s,x)=>s+x.secs,0); }
  function plan(){
    const p = resolvePattern();
    if(state.length === 'inf') return { untilStop:true, cycles:0 };
    const cycles = Math.max(1, Math.round((state.length*60) / cycleSeconds(p)));
    return { untilStop:false, cycles };
  }

  /* ---- HOME rendering ---- */
  function renderPatterns(){
    const list = $('#patList'); list.innerHTML = '';
    PATTERNS.forEach(p=>{
      const el = document.createElement('div');
      el.className = 'pat' + (p.id===state.patternId ? ' sel' : '');
      el.innerHTML = `<span class="nm">${p.name}</span><span class="ds">${p.desc}</span><span class="jp">${p.jp}</span>`;
      el.onclick = ()=>{ state.patternId = p.id; Store.set('pattern', p.id); renderPatterns(); syncSubs(); renderHonest(); };
      list.appendChild(el);
    });
  }
  function syncSubs(){
    $('#coherentSub').classList.toggle('open', state.patternId==='coherent');
    $('#customSub').classList.toggle('open', state.patternId==='custom');
    document.querySelectorAll('#coherentSub [data-rate]').forEach(b=>{
      b.classList.toggle('sel', parseFloat(b.dataset.rate)===state.coherentRate);
    });
  }
  function renderCustomEditor(){
    const c = state.custom;
    const ed = $('#customEditor');
    function stepRow(label, key, on){
      return `<div class="erow">
        <span class="et">${label}</span>
        <div class="stepper">
          <button data-dec="${key}">−</button>
          <span class="val" id="val_${key}">${fmt(c[key])}<small>s</small></span>
          <button data-inc="${key}">+</button>
        </div></div>`;
    }
    ed.innerHTML =
      stepRow('Inhale','inhale') +
      `<div class="erow"><button class="toggle-hold ${c.hold1?'on':''}" data-hold="hold1">${c.hold1?'hold ✓':'+ hold after inhale'}</button>
        <div class="stepper" style="${c.hold1?'':'visibility:hidden'}">
          <button data-dec="hold1secs">−</button><span class="val" id="val_hold1secs">${fmt(c.hold1secs)}<small>s</small></span><button data-inc="hold1secs">+</button>
        </div></div>` +
      stepRow('Exhale','exhale') +
      `<div class="erow"><button class="toggle-hold ${c.hold2?'on':''}" data-hold="hold2">${c.hold2?'hold ✓':'+ hold after exhale'}</button>
        <div class="stepper" style="${c.hold2?'':'visibility:hidden'}">
          <button data-dec="hold2secs">−</button><span class="val" id="val_hold2secs">${fmt(c.hold2secs)}<small>s</small></span><button data-inc="hold2secs">+</button>
        </div></div>`;

    ed.querySelectorAll('[data-inc]').forEach(b=> b.onclick=()=>adjust(b.dataset.inc, +1));
    ed.querySelectorAll('[data-dec]').forEach(b=> b.onclick=()=>adjust(b.dataset.dec, -1));
    ed.querySelectorAll('[data-hold]').forEach(b=> b.onclick=()=>{ const k=b.dataset.hold; state.custom[k]=!state.custom[k]; saveCustom(); renderCustomEditor(); renderHonest(); });
  }
  function adjust(key, dir){
    let v = state.custom[key] + dir;       // 1s steps, 1..20
    v = Math.max(1, Math.min(20, v));
    state.custom[key] = v; saveCustom();
    const el = document.getElementById('val_'+key); if(el) el.innerHTML = fmt(v)+'<small>s</small>';
    renderHonest();
  }
  function saveCustom(){ Store.set('custom', state.custom); }

  function renderSeg(sel, key, val, attr){
    document.querySelectorAll(sel+' button').forEach(b=> b.classList.toggle('sel', b.dataset[attr]===String(val)));
  }
  function renderHonest(){
    const p = resolvePattern(), cyc = cycleSeconds(p);
    const pl = plan();
    const el = $('#honest');
    if(pl.untilStop){ el.textContent = `one breath ≈ ${fmt(cyc)}s · runs until you stop`; }
    else { el.textContent = `about ${pl.cycles} breath${pl.cycles===1?'':'s'} · one breath ≈ ${fmt(cyc)}s`; }
  }

  /* ---- HOME wiring ---- */
  function wireHome(){
    renderPatterns(); renderCustomEditor(); syncSubs();
    renderSeg('#lenSeg','length', state.length, 'len');
    renderSeg('#themeSeg','theme', state.themeMode, 'theme');
    renderSeg('#soundSeg','sound', state.sound?'on':'off', 'sound');
    renderHonest();

    document.querySelectorAll('#lenSeg button').forEach(b=> b.onclick=()=>{
      const v = b.dataset.len; state.length = v==='inf'?'inf':parseInt(v,10);
      Store.set('length', state.length); renderSeg('#lenSeg','length',state.length,'len'); renderHonest();
    });
    document.querySelectorAll('#themeSeg button').forEach(b=> b.onclick=()=>{
      state.themeMode = b.dataset.theme; Store.set('theme', state.themeMode); renderSeg('#themeSeg','theme',state.themeMode,'theme');
    });
    document.querySelectorAll('#soundSeg button').forEach(b=> b.onclick=()=>{
      state.sound = b.dataset.sound==='on'; Store.set('sound', state.sound); renderSeg('#soundSeg','sound',state.sound?'on':'off','sound');
    });
    document.querySelectorAll('#coherentSub [data-rate]').forEach(b=> b.onclick=()=>{
      state.coherentRate = parseFloat(b.dataset.rate); Store.set('coherentRate', state.coherentRate); syncSubs(); renderHonest();
    });
    $('#beginBtn').onclick = begin;
  }

  /* ---- screen switching ---- */
  function show(id){
    document.querySelectorAll('.screen').forEach(s=> s.classList.remove('on'));
    $('#'+id).classList.add('on');
  }

  /* ---- render loop runs while in session ---- */
  function loop(){ pond.render(performance.now()); rafId = requestAnimationFrame(loop); }
  function startLoop(){ if(!rafId) loop(); }
  function stopLoop(){ if(rafId){ cancelAnimationFrame(rafId); rafId=null; } }

  /* ---- the session ---- */
  function setPhaseUI(ph){
    $('#phaseJp').textContent = PHASE_JP[ph.kind] || '';
    const w = $('#phaseWord');
    w.style.opacity = 0;
    setTimeout(()=>{ w.textContent = ph.label.toLowerCase(); w.style.opacity = 1; }, 180);
  }

  function begin(){
    // iOS audio: create / resume the AudioContext inside this tap
    tide.setOn(state.sound);
    tide.resume();

    const theme = resolveTheme();
    pond.setTheme(theme);
    $('#session').style.background = theme.bg;
    const tc = document.querySelector('meta[name="theme-color"]'); if(tc) tc.setAttribute('content', theme.bg);
    pond.resize(); pond.settleTo(0);
    startLoop();

    // reset overlays
    $('#closing').classList.remove('on'); $('#after').classList.remove('on');
    $('#phaseWord').textContent = ''; $('#phaseJp').textContent = '';
    $('#cyc').textContent = '';
    $('#soundToggle').textContent = tide.on ? 'tide' : 'silent';

    show('session');
    runSettle(()=> runBreath());
  }

  function runSettle(done){
    const box = $('#settle'), nEl = $('#settleN');
    let n = 10;
    nEl.textContent = n; box.classList.add('on');
    settleTimer = setInterval(()=>{
      n--;
      if(n <= 0){ clearInterval(settleTimer); settleTimer=null; box.classList.remove('on'); done(); return; }
      nEl.style.opacity = 0;
      setTimeout(()=>{ nEl.textContent = n; nEl.style.opacity = 1; }, 200);
    }, 1000);
  }

  function runBreath(){
    const p = resolvePattern();
    const pl = plan();
    clock.start({
      phases: p.phases, cycles: pl.cycles, untilStop: pl.untilStop,
      onPhase(ph){
        pond.setPhase(ph.kind, ph.secs);
        tide.phase(ph.kind, tide.now(), ph.secs);
        setPhaseUI(ph);
      },
      onCycle(c, total, inf){
        $('#cyc').textContent = inf ? 'breathe on' : `breath ${c} of ${total}`;
      },
      onDone(){ endSession(true); },
    });
  }

  function endSession(completed){
    clock.stop();
    if(settleTimer){ clearInterval(settleTimer); settleTimer=null; $('#settle').classList.remove('on'); }
    tide.silence();
    pond.setPhase('exhale', 4);       // let the water settle back to still
    $('#phaseWord').style.opacity = 0; $('#phaseJp').textContent = '';
    $('#cyc').textContent = '';

    if(completed) recordSession();

    // closing reflection
    $('#reflect').textContent = REFLECTIONS[Math.floor(Math.random()*REFLECTIONS.length)];
    $('#count').textContent = sessionCountLabel();
    $('#closing').classList.add('on');
    afterTimer = setTimeout(()=> $('#after').classList.add('on'), 2600);
  }

  function recordSession(){
    state.sessions += 1; Store.set('sessions', state.sessions);
    const today = new Date(); const dayKey = today.toISOString().slice(0,10);
    if(state.lastDay !== dayKey){
      const y = new Date(today); y.setDate(y.getDate()-1);
      const yKey = y.toISOString().slice(0,10);
      state.streak = (state.lastDay === yKey) ? state.streak+1 : 1;
      state.lastDay = dayKey;
      Store.set('streak', state.streak); Store.set('lastDay', state.lastDay);
    }
  }
  function sessionCountLabel(){
    const s = state.sessions;
    const base = s === 1 ? '1 session' : `${s} sessions`;
    const streak = state.streak > 1 ? ` · ${state.streak} days in a row` : '';
    return base + streak;
  }

  function leaveSession(){
    clock.stop(); stopLoop();
    if(afterTimer){ clearTimeout(afterTimer); afterTimer=null; }
    $('#closing').classList.remove('on'); $('#after').classList.remove('on');
  }

  /* ---- session controls ---- */
  function wireSession(){
    $('#endBtn').onclick = ()=>{ if(clock.running || settleTimer) endSession(false); };
    $('#soundToggle').onclick = ()=>{ tide.setOn(!tide.on); Store.set('sound', tide.on); state.sound = tide.on; $('#soundToggle').textContent = tide.on ? 'tide' : 'silent'; };
    $('#againBtn').onclick = ()=>{ leaveSession(); begin(); };
    $('#doneBtn').onclick = ()=>{ leaveSession(); show('home'); };
  }

  /* ---- boot ---- */
  function resizeAll(){ pond.resize(); }
  window.addEventListener('resize', resizeAll);
  window.addEventListener('orientationchange', ()=> setTimeout(resizeAll, 250));

  wireHome();
  wireSession();
  pond.setTheme(resolveTheme());
  // first paint of home
  requestAnimationFrame(()=> $('#home').classList.add('on'));
})();
</script>
</body>
</html>
